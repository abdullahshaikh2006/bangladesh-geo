<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বাংলাদেশ ভোটার তালিকা</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; padding:20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9ecef; padding-bottom: 15px; margin-bottom: 20px; }
        .header-left h1 { font-size: 24px; color:#1a2a3a; }
        .header-left h1 small { font-size: 14px; color:#6c757d; font-weight: 400; }
        
        .status-badge { padding: 6px 16px; border-radius: 20px; font-weight:600; font-size:14px; background:#28a745; color:#fff; }
        .status-badge.loading { background: #ffc107; color:#000; }
        .status-badge.offline { background: #dc3545; }

        .selector-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight:600; font-size:14px; color:#495057; margin-bottom:5px; }
        .form-group select { padding: 10px; border: 2px solid #dee2e6; border-radius: 8px; background: #f8f9fa; font-size:15px; font-family: 'Hind Siliguri'; }

        .loading-spinner { display: none; text-align: center; padding: 30px; }
        .loading-spinner.active { display: block; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e9ecef; border-top-color: #4dabf7; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .meta-card { display: none; background: #e3f2fd; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 5px solid #1976d2; }
        .meta-card.active { display: block; }
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .meta-item { background: #fff; padding: 8px; border-radius: 6px; text-align: center; }

        .filter-section { display: none; align-items: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .search-box { flex:1; display: flex; align-items:center; background:#f8f9fa; padding:8px 15px; border-radius:8px; border:2px solid #dee2e6; }
        .search-box input { border:none; background:transparent; outline:none; width:100%; font-size:15px; font-family:'Hind Siliguri'; }
        .voter-count { background: #e9ecef; padding: 5px 15px; border-radius: 20px; font-weight:600; }

        .voter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
        .voter-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .voter-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        
        .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #f1f3f5; padding-bottom: 8px; }
        .voter-name { font-size: 18px; font-weight:700; color:#1a2a3a; }
        .voter-serial { background: #4dabf7; color: #fff; padding: 2px 12px; border-radius: 20px; font-size:12px; }
        .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size:14px; }
        .detail .label { color:#6c757d; font-size:11px; font-weight:600; }
        .detail .value { color:#212529; font-weight:500; }
        .full-width { grid-column: 1 / -1; }

        @media(max-width:600px){ .voter-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>🇧🇩 ভোটার তালিকা <small>Bangladesh Location API</small></h1>
        </div>
        <div class="status-badge" id="statusBadge">✅ অনলাইন</div>
    </div>

    <div class="selector-group">
        <div class="form-group"><label>বিভাগ</label><select id="divisionSelect"><option>লোড হচ্ছে...</option></select></div>
        <div class="form-group"><label>জেলা</label><select id="districtSelect" disabled><option>বিভাগ সিলেক্ট করুন</option></select></div>
        <div class="form-group"><label>উপজেলা</label><select id="upazilaSelect" disabled><option>জেলা সিলেক্ট করুন</option></select></div>
        <div class="form-group"><label>ইউনিয়ন</label><select id="unionSelect" disabled><option>উপজেলা সিলেক্ট করুন</option></select></div>
        <div class="form-group"><label>গ্রাম</label><select id="villageSelect" disabled><option>ইউনিয়ন সিলেক্ট করুন</option></select></div>
    </div>

    <div class="loading-spinner" id="loadingSpinner"><div class="spinner"></div><p>ডেটা লোড হচ্ছে...</p></div>

    <div id="genderContainer" style="display:none; margin-top: 20px;">
        <div class="form-group">
            <label>লিঙ্গ নির্বাচন করুন</label>
            <select id="genderSelect"><option value="">-- নির্বাচন করুন --</option><option value="male">👨 পুরুষ</option><option value="female">👩 মহিলা</option></select>
        </div>
    </div>

    <div class="meta-card" id="metaCard"><div class="meta-grid" id="metaGrid"></div></div>

    <div class="filter-section" id="filterSection">
        <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="নাম বা আইডি দিয়ে খুঁজুন..." /></div>
        <div class="voter-count" id="voterCount">মোট: ০ জন</div>
    </div>

    <div class="voter-grid" id="voterGrid"></div>
</div>

<script>
const API = 'https://bangladesh-api-cl87.onrender.com/api'; // আপনার লোকালহোস্ট বা সার্ভার লিংক এখানে বসান

// DOM Elements
const els = {
    division: document.getElementById('divisionSelect'),
    district: document.getElementById('districtSelect'),
    upazila: document.getElementById('upazilaSelect'),
    union: document.getElementById('unionSelect'),
    village: document.getElementById('villageSelect'),
    genderContainer: document.getElementById('genderContainer'),
    gender: document.getElementById('genderSelect'),
    metaCard: document.getElementById('metaCard'),
    metaGrid: document.getElementById('metaGrid'),
    filterSection: document.getElementById('filterSection'),
    searchInput: document.getElementById('searchInput'),
    voterCount: document.getElementById('voterCount'),
    voterGrid: document.getElementById('voterGrid'),
    loading: document.getElementById('loadingSpinner'),
    status: document.getElementById('statusBadge')
};

let currentVillageData = null;

// Helper Functions
async function fetchData(url) {
    try {
        const res = await fetch(url);
        if(!res.ok) throw new Error('Network Error');
        const json = await res.json();
        return json.success ? json.data : null;
    } catch (e) { console.error(e); return null; }
}

function populateSelect(select, items, placeholder, valKey='id', labelKey='name') {
    select.innerHTML = `<option value="">${placeholder}</option>`;
    items.forEach(item => select.innerHTML += `<option value="${item[valKey]}">${item[labelKey] || item.bn_name}</option>`);
    select.disabled = false;
}

function setStatus(text, type='online') {
    els.status.textContent = text;
    els.status.className = 'status-badge ' + (type === 'loading' ? 'loading' : type === 'offline' ? 'offline' : '');
}

// --- Load Functions ---
async function loadDivisions() {
    setStatus('লোড হচ্ছে...', 'loading');
    const data = await fetchData(`${API}/divisions`);
    if(data) {
        populateSelect(els.division, data, 'বিভাগ সিলেক্ট করুন');
        setStatus('✅ সংযুক্ত');
    } else { setStatus('❌ অফলাইন', 'offline'); }
}

async function loadDistricts(id) {
    if(!id) { els.district.innerHTML = `<option>বিভাগ সিলেক্ট করুন</option>`; els.district.disabled = true; return; }
    const data = await fetchData(`${API}/divisions/${id}`);
    if(data && data.districts) populateSelect(els.district, data.districts, 'জেলা সিলেক্ট করুন');
}

async function loadUpazilas(id) {
    if(!id) { els.upazila.innerHTML = `<option>জেলা সিলেক্ট করুন</option>`; els.upazila.disabled = true; return; }
    const data = await fetchData(`${API}/districts/${id}`);
    if(data && data.upazilas) populateSelect(els.upazila, data.upazilas, 'উপজেলা সিলেক্ট করুন');
}

async function loadUnions(id) {
    if(!id) { els.union.innerHTML = `<option>উপজেলা সিলেক্ট করুন</option>`; els.union.disabled = true; return; }
    const data = await fetchData(`${API}/upazilas/${id}`);
    if(data && data.unions) populateSelect(els.union, data.unions, 'ইউনিয়ন সিলেক্ট করুন');
}

async function loadVillages(id) {
    if(!id) { els.village.innerHTML = `<option>ইউনিয়ন সিলেক্ট করুন</option>`; els.village.disabled = true; return; }
    const data = await fetchData(`${API}/unions/${id}`);
    if(data && data.villages) populateSelect(els.village, data.villages, 'গ্রাম সিলেক্ট করুন');
}

async function loadVillageDetails(id) {
    if(!id) { 
        els.genderContainer.style.display = 'none'; 
        els.metaCard.classList.remove('active'); 
        els.filterSection.style.display = 'none';
        els.voterGrid.innerHTML = '';
        return; 
    }
    currentVillageData = await fetchData(`${API}/villages/${id}`);
    if(currentVillageData) {
        els.genderContainer.style.display = 'block';
        els.gender.value = '';
        els.metaCard.classList.remove('active'); 
        els.filterSection.style.display = 'none';
        els.voterGrid.innerHTML = '';
    }
}

// --- Render Voters (Card) ---
function renderVoters(data) {
    if(!data || !data.voters || data.voters.length === 0) {
        els.voterGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px; color:#6c757d;">কোনো ভোটার পাওয়া যায়নি!</div>`;
        els.voterCount.textContent = 'মোট: ০ জন';
        return;
    }

    // Render Meta Card
    if(data.meta) {
        els.metaCard.classList.add('active');
        els.metaGrid.innerHTML = `
            <div class="meta-item"><div class="label">জেলা</div><div class="value">${data.meta.district || '—'}</div></div>
            <div class="meta-item"><div class="label">উপজেলা</div><div class="value">${data.meta.sub_district || '—'}</div></div>
            <div class="meta-item"><div class="label">ইউনিয়ন</div><div class="value">${data.meta.union || '—'}</div></div>
            <div class="meta-item" style="grid-column: 1/-1;"><div class="label">মোট ভোটার</div><div class="value">${data.meta.total_male_voters || data.meta.total_female_voters || data.meta.total_voters || data.voters.length} জন</div></div>
        `;
    }

    let html = '';
    data.voters.forEach(v => {
        html += `
            <div class="voter-card">
                <div class="card-header">
                    <div class="voter-name">${v.name || '—'}</div>
                    <div class="voter-serial">#${v.serial || '—'}</div>
                </div>
                <div class="card-body">
                    <div class="detail"><div class="label">ভোটার আইডি</div><div class="value">${v.voter_id || '—'}</div></div>
                    <div class="detail"><div class="label">পিতা</div><div class="value">${v.father || '—'}</div></div>
                    <div class="detail"><div class="label">মাতা</div><div class="value">${v.mother || '—'}</div></div>
                    <div class="detail"><div class="label">জন্ম তারিখ</div><div class="value">${v.date_of_birth || '—'}</div></div>
                    <div class="detail full-width"><div class="label">পেশা</div><div class="value">${v.occupation || '—'}</div></div>
                    <div class="detail full-width"><div class="label">ঠিকানা</div><div class="value">${v.address || '—'}</div></div>
                </div>
            </div>
        `;
    });
    els.voterGrid.innerHTML = html;
    els.voterCount.textContent = `মোট: ${data.voters.length} জন`;
    els.filterSection.style.display = 'flex';
}

// --- Events ---
els.division.addEventListener('change', (e) => { loadDistricts(e.target.value); });
els.district.addEventListener('change', (e) => { loadUpazilas(e.target.value); });
els.upazila.addEventListener('change', (e) => { loadUnions(e.target.value); });
els.union.addEventListener('change', (e) => { loadVillages(e.target.value); });
els.village.addEventListener('change', (e) => { loadVillageDetails(e.target.value); });

els.gender.addEventListener('change', async (e) => {
    const gender = e.target.value;
    if(!gender || !currentVillageData) return;

    // Logic to get file path from new structure
    if(!currentVillageData.population_files) {
        alert('এই গ্রামের জন্য জনসংখ্যা ফাইল পাওয়া যায়নি!');
        return;
    }

    // Find File URL
    const fileUrl = currentVillageData.population_files[gender];
    if(!fileUrl) {
        alert(`এই গ্রামের জন্য ${gender==='male'?'পুরুষ':'মহিলা'} ভোটার ফাইল পাওয়া যায়নি!`);
        return;
    }

    els.loading.classList.add('active');
    try {
        const response = await fetch(fileUrl);
        if(!response.ok) throw new Error('File load failed');
        const jsonData = await response.json();
        
        // ডেটা পাস করে দিচ্ছি কার্ডে
        renderVoters(jsonData);
    } catch (err) {
        console.error(err);
        alert('ভোটার ডেটা লোড করতে ব্যর্থ হয়েছে!');
        els.filterSection.style.display = 'none';
        els.voterGrid.innerHTML = '';
        els.metaCard.classList.remove('active');
    } finally {
        els.loading.classList.remove('active');
    }
});

// Search Feature
els.searchInput.addEventListener('input', function() {
    const query = this.value.trim().toLowerCase();
    if(!query) return;
    
    // ফিল্টার করার জন্য গ্রিডের কার্ড রিফ্রেশ করার লজিক এখানে বসানো যায় (আপনার ফাইল লোড হওয়ার পর)
    // তবে সাধারণ সার্চের জন্য ব্রাউজার সাইডে ফিল্টার করা যায়। 
    // যেহেতু পুরো ডেটা লোড করা হয়েছে, আমরা শুধু DOM থেকে ফিল্টার করতে পারি:
    const cards = document.querySelectorAll('.voter-card');
    let visibleCount = 0;
    cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        if(text.includes(query)) {
            card.style.display = 'block';
            visibleCount++;
        } else {
            card.style.display = 'none';
        }
    });
    els.voterCount.textContent = `ফলাফল: ${visibleCount} জন`;
});

// Init
loadDivisions();
</script>
</body>
</html>
